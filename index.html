<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<title>PHW-V01 包装结构</title>
<style>
  :root { --bg:#eeece6; --ink:#1d1d1f; --muted:#5f5e5a; --card:#faf8f3; --rule:#cfccc2; --accent:#b0612f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1e1c; --ink:#ecebe6; --muted:#a8a69d; --card:#2a2a28; --rule:#45443f; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
  #view { position:fixed; inset:0; }
  #cap { position:fixed; left:16px; top:14px; right:16px; pointer-events:none; }
  #cap b { display:inline-block; background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:8px 12px; font-weight:500; font-size:16px; }
  #legend { margin-top:8px; font-size:12px; color:var(--muted); }
  #legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 10px; vertical-align:-1px; }
  #ui { position:fixed; left:16px; right:16px; bottom:14px; background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:10px 12px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .row + .row { margin-top:8px; }
  button, select { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--rule); border-radius:8px; padding:4px 10px; cursor:pointer; }
  button.on { border-color:var(--accent); color:var(--accent); }
  #play { min-width:70px; }
  #t { flex:1; min-width:160px; accent-color:var(--accent); }
  #fr { font-variant-numeric:tabular-nums; color:var(--muted); min-width:84px; text-align:right; }
  .phases button { font-size:12px; padding:3px 8px; }
  .modes button { font-weight:500; }
  label { font-size:13px; color:var(--muted); display:flex; gap:4px; align-items:center; }
  .small { font-size:12px; color:var(--muted); }
  #print { margin-top:8px; }
  #print summary { cursor:pointer; font-size:13px; color:var(--muted); }
  #pgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:4px 16px; margin-top:6px; max-height:32vh; overflow:auto; }
  #pgrid label { justify-content:space-between; }
  #pgrid h4 { grid-column:1/-1; margin:6px 0 0; font-size:12px; font-weight:600; color:var(--ink); }
  #pgrid select, #pgrid button { font-size:12px; padding:2px 6px; }
</style>
</head>

// How an ink really looks (Dylan, 11-23: "the green is very vibrant"). Ink is a transparent film, so on kraft the board

$('partcol').onchange = () => { recolour(); paint(); };
$('art').onchange = () => paint(); $('whiteink').onchange = () => paint();
$('xray').addEventListener('change', e => { for (const s of skins) { const m = s.material; m.transparent = e.target.checked; m.opacity = e.target.checked ? 0.3 : 1; m.depthWrite = !e.target.checked; m.needsUpdate = true; } });
$('xray').onchange = e => { for (const o of Object.values(objs)) if (o.userData.kind !== 'contents') { const m = o.material; m.transparent = e.target.checked; m.opacity = e.target.checked ? 0.3 : 1; m.depthWrite = !e.target.checked; m.needsUpdate = true; } };
$('contents').onchange = () => sync(); $('edges').onchange = () => sync();

function apply(f) {
  const showTray = $('contents').checked, showEdges = $('edges').checked, te = TRAYDATA.tray_end, be = BANKDATA.bank_end;
  const place = T(TX, trayY(f), TZ);
  for (const [name, o] of Object.entries(objs)) {
    const k = o.userData.kind; let vis = true;
    if (mode === 'box') {
      if (k === 'shell') { o.matrix.copy(boxM(name, f)); const p = BOXDATA.parts[name]; vis = !(p.hide_after != null && f > p.hide_after); }
      else if (k === 'tray') { const n = name.slice(5); const lift = OWN[n] === 'card' ? T(0, 0, cardLift(f)) : I();
        o.matrix.copy(place.clone().multiply(lift).multiply(grpM(n, te))); vis = showTray; }
      else if (k === 'bank') { o.matrix.copy(place.clone().multiply(SEAT).multiply(bankM(name.slice(5), be))); vis = showTray; }
      else if (k === 'bankc') { o.matrix.copy(place.clone().multiply(SEAT)); vis = showTray; }
      else { o.matrix.copy(place); vis = showTray; }
    } else if (mode === 'tray') {
      if (k === 'shell') vis = false;
      else if (k === 'tray') { const n = name.slice(5); o.matrix.copy(grpM(n, f)); vis = f >= G[OWN[n]].from; }
      else if (k === 'bank') { o.matrix.copy(SEAT.clone().multiply(bankM(name.slice(5), be))); vis = f >= TRAYDATA.contents_from && showTray; }
      else if (k === 'bankc') { o.matrix.copy(SEAT); vis = f >= TRAYDATA.contents_from && showTray; }
      else { o.matrix.copy(I()); vis = f >= TRAYDATA.contents_from && showTray; }
    } else {
      if (k === 'bank') { const n = name.slice(5); o.matrix.copy(bankM(n, f)); vis = f >= BG[BOWN[n]].from; }
      else if (k === 'bankc') { const c = BANKDATA.contents[name.slice(3)];
        const rz = c.ride ? BGZ[c.ride](f) - BG[c.ride].place.z_keys[BG[c.ride].place.z_keys.length - 1][1] : 0;
        o.matrix.copy(T(BSL(f), 0, rz)); vis = f >= (c.from ?? BANKDATA.contents_from) && showTray; }
      else vis = false;
    }
    o.matrixWorldNeedsUpdate = true; o.visible = vis; o.userData.edges.visible = showEdges;
    for (const x of o.userData.extras) x.visible = showEdges;
  }
}
function sync() {
  const f = Math.round(frame), ph = MODES[mode].phases;
  tEl.value = f; frEl.textContent = '第 ' + f + ' 帧';
  let cap = ph[0][2]; for (const p of ph) if (f >= p[0]) cap = p[2];
  capEl.textContent = cap; playEl.textContent = playing ? '暂停' : '播放';
  [...phaseBox.children].forEach((b, i) => b.classList.toggle('on', f >= ph[i][0] && (i === ph.length - 1 || f < ph[i + 1][0])));
  apply(frame);
}
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w < h ? 50 : 35; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing) { frame += dt * 24 * +$('speed').value; if (frame >= MODES[mode].end) { frame = MODES[mode].end; playing = false; } sync(); }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
function paint() {
  const parts = $('partcol').checked;
  for (const s of skins) { s.visible = !parts; s.material.color.setHex(hexFor(PRINT[s.userData.key], s.userData.colKey, s.userData.key)); }
  for (const d of decals) { d.visible = !parts && $('art').checked;
    const m = d.userData.texW && $('whiteink').checked ? d.userData.texW : d.userData.tex; if (d.material.map !== m) { d.material.map = m; d.material.needsUpdate = true; } }
  if (parts) return;
  for (const [o, key] of whole) o.material.color.setHex(hexFor(PRINT[key], o.userData.colKey, key));
  for (const o of faced) {                 // cut edges take the part's colour (Dylan, 11-23): the outside's, or the inside's if only that is coloured
    const [ik, ok] = o.userData.faceKeys, k = ok;        // always the outside face's colour: a box that is kraft outside keeps kraft edges
    o.material.color.setHex(hexFor(PRINT[k], o.userData.colKey, k));
  }
  const by = {black: [], green: []};
  for (const r of PRINT_PARTS) if (r.length > 1 && PRINT[r[0]] !== 'kraft') by[PRINT[r[0]]].push(r[1].replace(/ \(.*\)/, '').replace(', ', ' ').toLowerCase());
  const said = [by.green.length ? 'PANTONE 7731 C：' + by.green.join('、') + '。' : '', by.black.length ? '黑色：' + by.black.join('、') + '。' : ''].filter(Boolean);
  const how = {kraft: '颜色按直接印在牛皮纸上的效果显示。', white: '颜色按先印白底再印色的效果显示。', swatch: '颜色按 Pantone 色卡显示（不是印在牛皮纸上的效果）。'}[INKLOOK];
  $('legend').textContent = (said.length ? said.join('') + '其余为牛皮纸原色。' + how : '全部为牛皮纸原色。') + '屏幕颜色仅供参考，以印刷说明和实物色样为准。红线为撕拉条刀线。';
}
(() => {                                   // the colour menus, built from PRINT_PARTS
  const opts = ['kraft', 'black', 'green'].map(v => `<option value="${v}">${INKNAME[v]}</option>`).join('');
  $('pgrid').innerHTML = `<label>颜色显示 <select id="pLook"><option value="white">先印白底的效果</option><option value="kraft">直接印在牛皮纸上的效果</option><option value="swatch">Pantone 色卡</option></select></label>`
    + `<label>全部纸板 <select id="pAll"><option value="">选择…</option>${opts}</select></label><span><button id="pReset">恢复</button></span>`
    + PRINT_PARTS.map(r => r.length === 1 ? `<h4>${r[0]}</h4>` : `<label>${r[1]} <select data-k="${r[0]}">${opts}</select></label>`).join('');
  const menus = [...$('pgrid').querySelectorAll('select[data-k]')];
  const set = (s, v) => { s.value = v; PRINT[s.dataset.k] = v; };
  for (const s of menus) { s.value = PRINT[s.dataset.k]; s.onchange = () => { PRINT[s.dataset.k] = s.value; paint(); }; }
  $('pAll').onchange = e => { const v = e.target.value; if (!v) return; for (const s of menus) if (s.dataset.k !== 'tissue') set(s, v); e.target.value = ''; paint(); };
  $('pReset').onclick = () => { for (const s of menus) set(s, PDEF[s.dataset.k]); paint(); };
  $('pLook').onchange = e => { INKLOOK = e.target.value; paint(); };
})();
legend(); paint(); setMode('box'); requestAnimationFrame(loop);
</script>
</body>
