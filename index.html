  .row + .row { margin-top:8px; }
  button, select { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--rule); border-radius:8px; padding:4px 10px; cursor:pointer; }
  button.on { border-color:var(--accent); color:var(--accent); }
  #play { min-width:70px; }
  #t { flex:1; min-width:160px; accent-color:var(--accent); }
  #fr { font-variant-numeric:tabular-nums; color:var(--muted); min-width:84px; text-align:right; }
  .phases button { font-size:12px; padding:3px 8px; }
  .modes button { font-weight:500; }
  label { font-size:13px; color:var(--muted); display:flex; gap:4px; align-items:center; }
  .small { font-size:12px; color:var(--muted); }

    [238, '充电宝', '充电宝穿过托板开口放到抽屉底面，USB-C 一端朝上'],

    [305, '打开', '手指勾住抽屉任意一端的半圆缺口拉出，或从另一端推出'],
    [355, '合上', '推回去']]},
};
let mode = 'box', frame = 0, playing = false, last = performance.now();
const $ = id => document.getElementById(id);
const tEl = $('t'), frEl = $('fr'), capEl = $('captxt'), playEl = $('play'), phaseBox = $('phases');
function legend() {
  const pal = PARTS;
  $('legend').innerHTML = $('partcol').checked ? LEGEND.map(([k, l]) => `<span style="background:#${pal[k].toString(16).padStart(6,'0')}"></span>${l}`).join('') : '全部为原色牛皮纸（不印刷）。红线为撕拉条刀线。勾选“部件分色”可区分各个部件。';
}
function recolour() {
  const pal = $('partcol').checked ? PARTS : KRAFT;
  for (const o of Object.values(objs)) o.material.color.setHex(pal[o.userData.colKey]);
  for (const d of overlays) d.material.color.setHex(pal.tape);
  legend();
}
function setMode(m) {
  mode = m; frame = 0; playing = false;
  $('mBox').classList.toggle('on', m === 'box'); $('mTray').classList.toggle('on', m === 'tray'); $('mBank').classList.toggle('on', m === 'bank');
  tEl.max = MODES[m].end; $('dims').textContent = MODES[m].dims;
  phaseBox.innerHTML = '';
  MODES[m].phases.forEach(([f, label]) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { frame = f; playing = false; sync(); }; phaseBox.appendChild(b); });
  const [p, tg] = MODES[m].cam; camera.position.set(...p); controls.target.set(...tg); controls.update();
  sync();
}
$('mBox').onclick = () => setMode('box'); $('mTray').onclick = () => setMode('tray'); $('mBank').onclick = () => setMode('bank');
tEl.oninput = () => { frame = +tEl.value; playing = false; sync(); };
playEl.onclick = () => { if (frame >= MODES[mode].end) frame = 0; playing = !playing; sync(); };
$('partcol').onchange = recolour;
$('xray').onchange = e => { for (const o of Object.values(objs)) if (o.userData.kind !== 'contents') { const m = o.material; m.transparent = e.target.checked; m.opacity = e.target.checked ? 0.3 : 1; m.depthWrite = !e.target.checked; m.needsUpdate = true; } };
$('contents').onchange = () => sync(); $('edges').onchange = () => sync();

function apply(f) {
  const showTray = $('contents').checked, showEdges = $('edges').checked, te = TRAYDATA.tray_end, be = BANKDATA.bank_end;
  const place = T(TX, trayY(f), TZ);
  for (const [name, o] of Object.entries(objs)) {
    const k = o.userData.kind; let vis = true;
    if (mode === 'box') {
      if (k === 'shell') { o.matrix.copy(boxM(name, f)); const p = BOXDATA.parts[name]; vis = !(p.hide_after != null && f > p.hide_after); }
      else if (k === 'tray') { const n = name.slice(5); const lift = OWN[n] === 'card' ? T(0, 0, cardLift(f)) : I();
        o.matrix.copy(place.clone().multiply(lift).multiply(grpM(n, te))); vis = showTray; }
      else if (k === 'bank') { o.matrix.copy(place.clone().multiply(SEAT).multiply(bankM(name.slice(5), be))); vis = showTray; }
      else if (k === 'bankc') { o.matrix.copy(place.clone().multiply(SEAT)); vis = showTray; }
      else { o.matrix.copy(place); vis = showTray; }
    } else if (mode === 'tray') {
      if (k === 'shell') vis = false;
      else if (k === 'tray') { const n = name.slice(5); o.matrix.copy(grpM(n, f)); vis = f >= G[OWN[n]].from; }
      else if (k === 'bank') { o.matrix.copy(SEAT.clone().multiply(bankM(name.slice(5), be))); vis = f >= TRAYDATA.contents_from && showTray; }
      else if (k === 'bankc') { o.matrix.copy(SEAT); vis = f >= TRAYDATA.contents_from && showTray; }
      else { o.matrix.copy(I()); vis = f >= TRAYDATA.contents_from && showTray; }
    } else {
      if (k === 'bank') { const n = name.slice(5); o.matrix.copy(bankM(n, f)); vis = f >= BG[BOWN[n]].from; }
      else if (k === 'bankc') { const c = BANKDATA.contents[name.slice(3)];
        const rz = c.ride ? BGZ[c.ride](f) - BG[c.ride].place.z_keys[BG[c.ride].place.z_keys.length - 1][1] : 0;
        o.matrix.copy(T(BSL(f), 0, rz)); vis = f >= (c.from ?? BANKDATA.contents_from) && showTray; }
      else vis = false;
    }
    o.matrixWorldNeedsUpdate = true; o.visible = vis; o.userData.edges.visible = showEdges;
    for (const x of o.userData.extras) x.visible = showEdges;
  }
}
function sync() {
  const f = Math.round(frame), ph = MODES[mode].phases;
  tEl.value = f; frEl.textContent = '第 ' + f + ' 帧';
  let cap = ph[0][2]; for (const p of ph) if (f >= p[0]) cap = p[2];
  capEl.textContent = cap; playEl.textContent = playing ? '暂停' : '播放';
  [...phaseBox.children].forEach((b, i) => b.classList.toggle('on', f >= ph[i][0] && (i === ph.length - 1 || f < ph[i + 1][0])));
  apply(frame);
}
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w < h ? 50 : 35; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing) { frame += dt * 24 * +$('speed').value; if (frame >= MODES[mode].end) { frame = MODES[mode].end; playing = false; } sync(); }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
legend(); setMode('box'); requestAnimationFrame(loop);
</script>
</body>
</html>
